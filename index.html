  <style>

    * { box-sizing: border-box; }
    body { margin: 0; }
    .header {

      gap: 12px;
      min-height: 66px;
      padding: 12px 18px;
      border-bottom: 1px solid #ddd;
    }

      padding: 11px;

      border-radius: 5px;
      font-size: 16px;
    }

      border-radius: 5px;
      background: #004699;
      color: white;

      font-weight: 700;

    #status { font-size: 13px; padding: 7px 16px; min-height: 30px; }
    #map { height: calc(100dvh - 160px); min-height: 320px; }
    .meter-label {
      display: inline-block;
      position: relative;
      transform: translate(-50%, -100%);
      padding: 4px 7px;
      border-radius: 5px;
      background: var(--label-color, #004699);
      color: #fff;
      border: 2px solid white;
      box-shadow: 0 1px 5px #0006;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }
    .meter-label::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -9px;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--label-color, #004699);
    }
    .leaflet-div-icon { border: none; background: transparent; }
    @media (max-width: 650px) {
      .heading { font-size: 17px; }
      .header { min-height: 56px; padding: 9px 12px; }
      .toolbar { padding: 8px; }
      #status { padding: 6px 10px; }
      #map { height: calc(100dvh - 154px); }
    }

    const radiusMeters = 1000;
    const map = L.map('map', { zoomControl: true }).setView([52.37, 4.90], 14);
    const markers = L.layerGroup().addTo(map);
    const status = document.getElementById('status');
    const search = document.getElementById('search');
    let gpsMarker = null;
    let gpsWatchId = null;
    let followGps = true;
    let lastGps = null;
    let refreshHandle = null;

    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      {
        maxZoom: 19,
        attribution: 'Kaart: Esri | Gegevens: RDW/NPR'
      }
    ).addTo(map);

    const circle = L.circle(map.getCenter(), {
      radius: radiusMeters,
      color: '#e21b23',
      weight: 2,
      fillColor: '#e21b23',
      fillOpacity: 0.04,
      interactive: false
    }).addTo(map);

    function distanceMeters(lat1, lon1, lat2, lon2) {
      const toRadians = Math.PI / 180;
      const latitudeDifference = (lat2 - lat1) * toRadians;
      const longitudeDifference = (lon2 - lon1) * toRadians;
      const a = Math.sin(latitudeDifference / 2) ** 2 +
        Math.cos(lat1 * toRadians) * Math.cos(lat2 * toRadians) *
        Math.sin(longitudeDifference / 2) ** 2;
      return 12742000 * Math.asin(Math.min(1, Math.sqrt(a)));
    }

    // Amsterdamse tariefgroepen behouden hun bestaande kleuren.
    const AMS_COLORS = {
            "T13B": "#E53935",
            "T12A": "#00ACC1",
            "T12B": "#F9A825",
            "T11V": "#EF6C00",
            "T17D": "#1565C0",

            "T17N": "#EF6C00",
            "T12G": "#00897B",
            "T13BV": "#5E35B1",

            "T18A": "#8E24AA",
            "T18P": "#827717"
        };
    const PALETTE = ['#1565C0','#D81B60','#2E7D32','#EF6C00','#6A1B9A','#00897B','#C62828','#3949AB','#827717','#AD1457','#00695C','#5D4037'];
    function tariffColor(tariff) {
      if (AMS_COLORS[tariff]) return AMS_COLORS[tariff];
      let hash = 2166136261;
      for (const char of String(tariff)) {
        hash ^= char.charCodeAt(0);
        hash = Math.imul(hash, 16777619);
      }
      return PALETTE[(hash >>> 0) % PALETTE.length];
    }

    function markerIcon(number, tariff) {
      const element = document.createElement('span');
      element.className = 'meter-label';
      element.style.setProperty('--label-color', tariffColor(tariff));
      element.textContent = number;
      return L.divIcon({
        html: element.outerHTML,
        iconSize: [1, 1],
        iconAnchor: [0, 0],
        popupAnchor: [0, -25]
      });
    }

    function updateMarkers() {
      const center = map.getCenter();
      const latitudePadding = radiusMeters / 110540;
      const longitudePadding = radiusMeters /
        (111320 * Math.max(0.1, Math.cos(center.lat * Math.PI / 180)));
      let count = 0;
      markers.clearLayers();
      circle.setLatLng(center);

      for (const [number, lat, lon, tariff, domain, address] of verkooppunten) {
        if (Math.abs(lat - center.lat) > latitudePadding ||
            Math.abs(lon - center.lng) > longitudePadding) {
          continue;
        }
        if (distanceMeters(center.lat, center.lng, lat, lon) > radiusMeters) {
          continue;
        }
        const marker = L.marker([lat, lon], {
          icon: markerIcon(number, tariff),
          keyboard: true
        });
        const safeTariff = String(tariff).replace(/&/g, '&amp;').replace(/</g, '&lt;');
        const popupPrefix = '<strong>Verkooppunt ' + number + '</strong>' +
          '<div>Tariefgroep: ' + safeTariff + '</div>';
        const safeAddress = String(address || 'Adres niet beschikbaar')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        marker.bindPopup(popupPrefix + '<div>Adres: ' + safeAddress + '</div>');
        markers.addLayer(marker);
        count++;
      }
      status.textContent = count + ' locaties binnen 1000 meter van het kaartmiddelpunt' +
        (followGps && lastGps ? ' · GPS volgen actief' : ' · vrij bewegen');
    }

    function scheduleRefresh() {
      clearTimeout(refreshHandle);
      refreshHandle = setTimeout(updateMarkers, 80);
    }

    function stopFollowing() {
      followGps = false;
    }

    map.on('movestart', function (event) {
      if (event.originalEvent) {
        stopFollowing();
      }
    });
    map.on('dragstart', stopFollowing);
    map.on('zoomstart', function (event) {
      if (event.originalEvent) {
        stopFollowing();
      }
    });
    map.on('moveend zoomend', scheduleRefresh);

    function onGps(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      lastGps = [lat, lon];
      if (!gpsMarker) {
        gpsMarker = L.circleMarker(lastGps, {
          radius: 8,
          color: '#fff',
          weight: 3,
          fillColor: '#0075e6',
          fillOpacity: 1
        }).addTo(map).bindPopup('Mijn GPS-locatie');
      } else {
        gpsMarker.setLatLng(lastGps);
      }
      if (followGps) {
        map.setView(lastGps, Math.max(map.getZoom(), 15));
      }
    }

    function gpsError(error) {
      status.textContent = 'GPS niet beschikbaar: ' + error.message +
        '. Je kunt de kaart gewoon verschuiven.';
    }

    function startGps() {
      if (!navigator.geolocation) {
        status.textContent = 'Deze browser ondersteunt geen GPS.';
        return;
      }
      if (gpsWatchId !== null) {
        return;
      }
      gpsWatchId = navigator.geolocation.watchPosition(
        onGps,
        gpsError,
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
      );
    }

    document.getElementById('gpsButton').addEventListener('click', function () {
      followGps = true;
      if (lastGps) {
        map.setView(lastGps, Math.max(map.getZoom(), 15));
      }
      startGps();
      updateMarkers();
    });

    document.getElementById('amsterdamButton').addEventListener('click', function () {
      stopFollowing();
      map.setView([52.37, 4.90], 15);
    });

    function findNumber() {
      const number = search.value.trim();
      if (!number) {
        return;
      }
      const matches = verkooppunten.filter(point => point[0] === number);
      if (matches.length === 0) {
        status.textContent = 'Verkooppunt ' + number + ' niet gevonden.';
        return;
      }
      stopFollowing();
      map.setView([matches[0][1], matches[0][2]], 17);
      status.textContent = matches.length + ' locatie(s) gevonden voor ' + number +
        '. De kaart toont de eerste locatie.';
    }

    document.getElementById('searchButton').addEventListener('click', findNumber);
    search.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        findNumber();
      }
    });

    updateMarkers();
    startGps();
  </script>
</body>
</html>
